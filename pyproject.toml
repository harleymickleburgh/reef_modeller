[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reef_modeller"
license = {text = "CC-BY-SA-4.0"}
version = "2026.01rc1"
dependencies = [
"matplotlib>=3.6.3",
"numpy>=2.4.1",
"pandas>=2.3.3",
"pytest>=9.0.2",
"scipy>=1.17.0",
]

[project.scripts]
reef_model = "bin.reef_modeller:main"

[tool.setuptools]
# This replaces the find_packages(where="src") logic
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
